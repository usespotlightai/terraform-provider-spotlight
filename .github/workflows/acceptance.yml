name: Acceptance

# This workflow runs the TF_ACC tests against a throwaway Spotlight control
# plane. scripts/acceptance/run.sh starts the control plane at a Spotlight
# release, creates a workspace and a token there, runs make testacc and
# removes the control plane.

on:
  workflow_dispatch:
    inputs:
      spotlight_version:
        description: "The Spotlight release (control-plane image tag) to test against."
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1-5"

permissions:
  contents: read
  packages: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Acceptance tests
        env:
          SPOTLIGHT_VERSION: ${{ inputs.spotlight_version }}
        run: scripts/acceptance/run.sh
