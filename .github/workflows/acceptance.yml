name: Acceptance

# Runs the TF_ACC tests against a dev control plane, inside the token's own
# workspace. Each run imports the workspace, creates every kind of resource
# under random keys, round-trips an export, destroys what it created, and
# leaves the workspace as it found it.
#   SPOTLIGHT_ACC_URL        the dev control plane, as in https://dev.spotlight.example.com
#   SPOTLIGHT_ACC_TOKEN      a workspace API token there with configure, secrets and runners
#   SPOTLIGHT_ACC_WORKSPACE  the slug of that token's workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1-5"

permissions:
  contents: read

concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TF_ACC: "1"
      SPOTLIGHT_URL: ${{ secrets.SPOTLIGHT_ACC_URL }}
      SPOTLIGHT_API_TOKEN: ${{ secrets.SPOTLIGHT_ACC_TOKEN }}
      SPOTLIGHT_ACC_WORKSPACE: ${{ secrets.SPOTLIGHT_ACC_WORKSPACE }}
    steps:
      - name: Skip without a dev control plane
        if: env.SPOTLIGHT_URL == '' || env.SPOTLIGHT_API_TOKEN == '' || env.SPOTLIGHT_ACC_WORKSPACE == ''
        run: echo "::notice::SPOTLIGHT_ACC_URL, SPOTLIGHT_ACC_TOKEN and SPOTLIGHT_ACC_WORKSPACE are not all set; acceptance tests skipped."
      - uses: actions/checkout@v7
        if: env.SPOTLIGHT_URL != '' && env.SPOTLIGHT_API_TOKEN != '' && env.SPOTLIGHT_ACC_WORKSPACE != ''
      - uses: actions/setup-go@v7
        if: env.SPOTLIGHT_URL != '' && env.SPOTLIGHT_API_TOKEN != '' && env.SPOTLIGHT_ACC_WORKSPACE != ''
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v4
        if: env.SPOTLIGHT_URL != '' && env.SPOTLIGHT_API_TOKEN != '' && env.SPOTLIGHT_ACC_WORKSPACE != ''
        with:
          terraform_wrapper: false
      - name: Acceptance tests
        if: env.SPOTLIGHT_URL != '' && env.SPOTLIGHT_API_TOKEN != '' && env.SPOTLIGHT_ACC_WORKSPACE != ''
        run: make testacc
