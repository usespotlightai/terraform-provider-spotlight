name: Release

# This workflow builds an archive for each platform, a SHA256SUMS file signed
# with the release GPG key, and the registry manifest. It publishes them as a
# GitHub release. The Terraform Registry gets the release from there.
#   GPG_PRIVATE_KEY  the armored private key. The usespotlightai namespace on
#                    registry.terraform.io has its public key.
#   GPG_PASSPHRASE   the passphrase of that key

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
