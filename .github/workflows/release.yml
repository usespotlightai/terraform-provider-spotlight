name: Release

# Builds per-platform archives, a SHA256SUMS signed with the release GPG key,
# and the registry manifest, and publishes them as a GitHub release. The
# Terraform Registry picks the release up from there.
#   GPG_PRIVATE_KEY  the armored private key whose public half is registered
#                    with the usespotlightai namespace on registry.terraform.io
#   GPG_PASSPHRASE   its passphrase

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
