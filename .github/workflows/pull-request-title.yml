name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit on main, and
# release-please reads it to choose the next version and write the changelog.
# The title is a Conventional Commit with the Linear issue as the scope, as in
# "feat(SPO-123): Add the judge to stations".

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            ci
            test
            refactor
            build
          requireScope: false
          ignoreLabels: |
            autorelease: pending
